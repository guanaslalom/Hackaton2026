<template>
    <div class="leaderboard">
        <div class="slds-grid slds-grid_align-spread slds-m-bottom_small">
            <h2 class="slds-text-heading_medium">Leaderboard</h2>
            <lightning-button label="Back" variant="neutral" onclick={handleBack}></lightning-button>
        </div>

        <template lwc:if={isLoading}>
            <lightning-spinner alternative-text="Loading leaderboard" size="small"></lightning-spinner>
        </template>
        <template lwc:elseif={loadError}>
            <p class="slds-text-color_error" role="alert">{loadError}</p>
        </template>
        <template lwc:else>
            <lightning-tabset variant="scoped" active-tab-value={activeTab}>
                <lightning-tab label="Top 10" value="top10" onactive={handleTabActive}></lightning-tab>
                <lightning-tab label="Top 50" value="top50" onactive={handleTabActive}></lightning-tab>
                <lightning-tab label="My rank" value="mine" onactive={handleTabActive}></lightning-tab>
            </lightning-tabset>

            <template lwc:if={hasRows}>
                <table class="slds-table slds-table_cell-buffer slds-table_bordered">
                    <thead>
                        <tr>
                            <th scope="col">Rank</th>
                            <th scope="col">Player</th>
                            <th scope="col" class="slds-text-align_right">Score</th>
                            <th scope="col" class="slds-text-align_right">Time</th>
                            <th scope="col" class="slds-text-align_right">Moves</th>
                        </tr>
                    </thead>
                    <tbody>
                        <template for:each={rows} for:item="row">
                            <tr key={row.key} class={row.rowClass}>
                                <td>{row.rank}</td>
                                <td>{row.displayName}</td>
                                <td class="slds-text-align_right">{row.score}</td>
                                <td class="slds-text-align_right">{row.time}</td>
                                <td class="slds-text-align_right">{row.moves}</td>
                            </tr>
                        </template>
                    </tbody>
                </table>
            </template>
            <template lwc:else>
                <p class="slds-p-vertical_medium">{emptyMessage}</p>
            </template>
        </template>
    </div>
</template>
